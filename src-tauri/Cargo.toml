[package]
name = "app"
version = "0.3.5"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
soundcloud-rs = "0.14"
tokio = { version = "1", features = ["sync"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-dialog = "2"
md-5 = "0.10"
discord-rich-presence = "1.1.0"

# Р’РµРЅРґРѕСЂРµРЅРЅР°СЏ РєРѕРїРёСЏ soundcloud-rs СЃ rustls РІРјРµСЃС‚Рѕ native-tls:
# OpenSSL РЅРµ РєСЂРѕСЃСЃ-РєРѕРјРїРёР»РёСЂСѓРµС‚СЃСЏ РїРѕРґ Android, rustls вЂ” С‡РёСЃС‚С‹Р№ Rust
[patch.crates-io]
soundcloud-rs = { path = "vendor/soundcloud-rs-0.14.0" }


